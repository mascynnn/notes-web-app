name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Install dependencies
      run: |
        composer install || true

    - name: Run tests
      run: |
        if [ -f ./vendor/bin/phpunit ]; then
          ./vendor/bin/phpunit
        else
          echo "No tests yet"
        fi